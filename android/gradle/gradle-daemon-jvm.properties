# Gradle Daemon JVM criteria. Robolectric 4.14 cannot run on JDK 25+, so the daemon (and the
# test JVMs it forks) runs on JDK 21 regardless of the machine's default Java.
# Written by hand: `./gradlew updateDaemonJvm` also wants toolchain download URLs, which need a
# toolchain resolver plugin this build does not use. Gradle picks up a locally installed JDK 21.
toolchainVersion=21
