name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  android-test:
    name: Android unit tests (+ Robolectric Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  ios-test:
    name: iOS unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Run iOS unit tests
        working-directory: ios
        run: |
          set -o pipefail
          # Pick the first available iPhone simulator instead of hard-coding a model.
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project BeatSide.xcodeproj \
            -scheme BeatSide \
            -destination "platform=iOS Simulator,name=$DEVICE"

  ios-ui-test:
    name: iOS UI/accessibility tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Run iOS UI tests
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project BeatSide.xcodeproj \
            -scheme BeatSideUITests \
            -destination "platform=iOS Simulator,name=$DEVICE"
